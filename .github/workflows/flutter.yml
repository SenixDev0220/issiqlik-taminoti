name: Flutter and Firebase security checks

on:
  push:
    branches: [main, 'security/**', 'fix/audit-reliability']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    name: Analyze, test responsive layouts, build test APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: '3.47.6'
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze --fatal-infos
      - run: flutter test
      - name: Build test APK (not production signed)
        run: flutter build apk --debug
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: issiqlik-debug-test-only
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  firebase-rules:
    name: Firebase emulator security tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Operator unit tests (injected SDK, no credentials)
        run: node --test tools/operator.test.cjs
      - run: npm audit --audit-level=high
      - run: npm run test:security

  gitleaks:
    name: Gitleaks history and source scan (enforced)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      # Official MIT-licensed CLI, not gitleaks-action: no organization license or PR secret.
      - name: Install verified Gitleaks 8.30.1
        shell: bash
        run: |
          set -euo pipefail
          install_dir="$RUNNER_TEMP/gitleaks-bin"
          mkdir -p "$install_dir"
          archive="$RUNNER_TEMP/gitleaks_8.30.1_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            --proto '=https' --proto-redir '=https' \
            'https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz' \
            --output "$archive"
          # Official v8.30.1 checksums.txt and release asset SHA256, reviewed together.
          printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' "$archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$install_dir" gitleaks
          chmod 0755 "$install_dir/gitleaks"
          "$install_dir/gitleaks" version
      - name: Scan complete fetched history and current sources
        shell: bash
        run: |
          set -euo pipefail
          scanner="$RUNNER_TEMP/gitleaks-bin/gitleaks"
          history_status=0
          sources_status=0
          "$scanner" git . --config .gitleaks.toml --log-opts='--all --full-history' \
            --redact=100 --no-banner --ignore-gitleaks-allow --exit-code 1 || history_status=$?
          "$scanner" dir . --config .gitleaks.toml \
            --redact=100 --no-banner --ignore-gitleaks-allow --exit-code 1 || sources_status=$?
          if [ "$history_status" -ne 0 ] || [ "$sources_status" -ne 0 ]; then
            printf '%s\n' 'Gitleaks found a leak or could not complete a scan; both scans must pass.' >&2
            exit 1
          fi
