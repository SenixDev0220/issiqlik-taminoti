name: Feature request
description: Suggest an improvement for the app
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: What work problem should this solve?
      description: Describe the user or operational need.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What would you like to happen?
      description: Describe the feature or workflow you have in mind.
    validations:
      required: true
