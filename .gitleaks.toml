title = "Issiqlik secret scanning"
minVersion = "v8.30.1"

[extend]
useDefault = true

# Rule-scoped, not global: a global paths allowlist makes `gitleaks dir`
# skip the whole file, even with condition=AND. Other secrets must still fail.
[[allowlists]]
targetRules = ["gcp-api-key", "generic-api-key"]
description = "Public Android Firebase client key in its two reviewed configuration files; not an Admin/service-account credential"
condition = "AND"
paths = ['''^android[/\\]app[/\\]google-services\.json$''', '''^lib[/\\]firebase_options\.dart$''']
regexTarget = "secret"
regexes = ['''^AIzaSyCDN0bAsklneKrZcJ21QJ-fVWZ_DkdAl4c$''']
